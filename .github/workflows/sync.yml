name: Sync Forgejo to Docker Hub

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install Skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Sync Image Tags
        run: |
          for mapping in 15:15 16:16 16:latest; do
            src_tag="${mapping%%:*}"
            dst_tag="${mapping##*:}"
            src="docker://codeberg.org/forgejo/forgejo:$src_tag"
            dst="docker://${{ secrets.DOCKERHUB_USERNAME }}/forgejo:$dst_tag"

            src_digest=$(skopeo inspect --format '{{.Digest}}' "$src")
            dst_digest=$(skopeo inspect --format '{{.Digest}}' "$dst" 2>/dev/null || true)

            if [ "$src_digest" = "$dst_digest" ]; then
              echo "$dst_tag is already up to date"
              continue
            fi

            echo "Syncing $src_tag -> $dst_tag..."
            skopeo copy --multi-arch all "$src" "$dst"
          done
